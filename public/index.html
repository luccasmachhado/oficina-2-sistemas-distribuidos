<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LTD - Oficina Full Stack</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="container">
        <h1>LTD - Painel de Tarefas</h1>
        <p class="subtitulo">Minha primeira aplicacao Full Stack</p>

        <section class="formulario">
            <input id="titulo" type="text" placeholder="Digite uma tarefa">
            <button id="botaoAdicionar">Adicionar</button>
        </section>

        <p id="mensagem" class="mensagem" aria-live="polite"></p>

        <section>
            <h2>Tarefas</h2>
            <ul id="listaTarefas"></ul>
        </section>
    </main>

    <script src="app.js"></script>
</body>
</html>
